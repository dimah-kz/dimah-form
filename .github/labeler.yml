pkg:core:
  - changed-files:
      - any-glob-to-any-file: packages/core/**

pkg:server:
  - changed-files:
      - any-glob-to-any-file: packages/server/**

pkg:db:
  - changed-files:
      - any-glob-to-any-file: packages/db/**

pkg:react:
  - changed-files:
      - any-glob-to-any-file: packages/react/**

pkg:ui:
  - changed-files:
      - any-glob-to-any-file:
          - packages/ui/**
          - registry.json

pkg:scoring:
  - changed-files:
      - any-glob-to-any-file: packages/scoring/**

pkg:dataset:
  - changed-files:
      - any-glob-to-any-file: packages/dataset/**

pkg:insights:
  - changed-files:
      - any-glob-to-any-file: packages/insights/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**
          - apps/**
