name: Feature request
description: Suggest an idea for a package
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package would this live in?
      options:
        - "@dimah-form/core"
        - "@dimah-form/server"
        - "@dimah-form/db"
        - "@dimah-form/react"
        - "@dimah-form/ui"
        - "@dimah-form/scoring"
        - "@dimah-form/dataset"
        - "@dimah-form/insights"
        - unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your proposed API/behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or trade-offs.
