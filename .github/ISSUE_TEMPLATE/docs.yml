name: Documentation
description: Improve README, package docs, or examples
title: "[Docs]: "
labels:
  - documentation
body:
  - type: dropdown
    id: location
    attributes:
      label: Where?
      options:
        - README
        - Package README
        - CONTRIBUTING / SECURITY
        - Example app
        - Other
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What should change?
    validations:
      required: true
