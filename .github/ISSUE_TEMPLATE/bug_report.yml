name: Bug report
description: Report a reproducible bug in a package
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal reproduction.

        Security vulnerabilities must not be filed as public issues. Use [private reporting](https://github.com/dimah-kz/dimah-form/security/advisories/new).
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@dimah-form/core"
        - "@dimah-form/server"
        - "@dimah-form/db"
        - "@dimah-form/react"
        - "@dimah-form/ui"
        - "@dimah-form/scoring"
        - examples
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction.
      placeholder: |
        1. Install package
        2. Run code
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.0.x"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 24, pnpm 12, Windows 11"
